<!DOCTYPE html>
<html>
<head>
    <title>Savings Project</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f4f8;
        }

        header {
            background: #244493;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .register {
            background: #244493;
            color: white;
        }

        .login {
            background: #ddd;
        }
    </style>
</head>

<body>

<header>
    <h1>Savings Project</h1>
    <p>Save together. Grow together.</p>
</header>

<div class="box">

    <h2>Welcome 👋</h2>

    <p>Manage your savings easily and securely.</p>

    <button class="register"
            onclick="window.location.href='/register'">
        Register
    </button>

    <button class="login"
            onclick="window.location.href='/login'">
        Login
    </button>

</div>

</body>
</html>
